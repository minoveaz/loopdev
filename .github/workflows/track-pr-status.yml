name: Track PR status

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'tracks/**'

concurrency:
  group: track-pr-status-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  report:
    name: Label and summarize tracks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted automation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Synchronize track labels and status comment
        uses: actions/github-script@v7
        with:
          script: |
            const {
              MANAGED_TRACK_LABEL,
              TRACK_STATUS_MARKER,
              buildTrackStatusComment,
              getTrackLabels,
              isTrackPath,
              parseTrackStatus,
            } = await import('${{ github.workspace }}/scripts/tracks/pr-status.mjs');
            const pull = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const labelColor = '0E8A16';
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pull.number,
              per_page: 100,
            });
            const trackPaths = files
              .filter((file) => file.status !== 'removed' && isTrackPath(file.filename))
              .map((file) => file.filename);
            const deletedPaths = files
              .filter((file) => file.status === 'removed' && isTrackPath(file.filename))
              .map((file) => file.filename);
            const tracks = [];

            for (const filePath of trackPaths) {
              try {
                const response = await github.rest.repos.getContent({
                  owner,
                  repo,
                  path: filePath,
                  ref: pull.head.sha,
                });
                if (Array.isArray(response.data) || response.data.type !== 'file') continue;
                const content = Buffer.from(response.data.content, response.data.encoding).toString('utf8');
                const track = parseTrackStatus(content, filePath);
                if (track) tracks.push(track);
              } catch (error) {
                core.warning(`Could not read ${filePath}: ${error.message}`);
              }
            }

            const labels = getTrackLabels(tracks, trackPaths.length > 0 || deletedPaths.length > 0);

            const currentLabels = pull.labels.map((label) => label.name);
            const labelsToRemove = currentLabels.filter((label) => MANAGED_TRACK_LABEL.test(label) && !labels.has(label));
            for (const label of labelsToRemove) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: pull.number, name: label });
            }
            for (const label of labels) {
              if (currentLabels.includes(label)) continue;
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label,
                  color: labelColor,
                  description: 'Managed by LoopDev track automation',
                });
              }
              await github.rest.issues.addLabels({ owner, repo, issue_number: pull.number, labels: [label] });
            }

            const body = buildTrackStatusComment(tracks, deletedPaths, pull.head.sha);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pull.number,
              per_page: 100,
            });
            const previous = comments.find((comment) => comment.user.type === 'Bot' && comment.body.includes(TRACK_STATUS_MARKER));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pull.number, body });
            }
