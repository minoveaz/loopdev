name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  git-conventions:
    name: Delivery traceability and PR conventions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate branch, PR title and commits
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          COMMIT_RANGE: ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
        run: pnpm exec node scripts/validate-git-conventions.mjs --branch "$HEAD_BRANCH" --pr-title "$PR_TITLE" --range "$COMMIT_RANGE"

  changes:
    name: 'Validation plan: affected risks and surfaces'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      shell: ${{ steps.filter.outputs.shell }}
      quality: ${{ steps.plan.outputs.full_fallback }}
      package_validation: ${{ steps.impact.outputs.has_targeted_validation }}
      mobile: ${{ steps.impact.outputs.mobile }}
      browser_desktop: ${{ steps.plan.outputs.browser_desktop }}
      browser_mobile: ${{ steps.plan.outputs.browser_mobile }}
      browser_visual: ${{ steps.plan.outputs.browser_visual }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Detect frontend changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'apps/loopdev-os/**'
              - 'ds/packages/ui/**'
              - 'packages/contracts/**'
              - 'e2e/**'
              - 'playwright.config.mjs'
              - 'package.json'
              - 'pnpm-lock.yaml'
            shell:
              - 'apps/loopdev-os/src/app/globals.css'
              - 'apps/loopdev-os/src/app/layout.tsx'
              - 'apps/loopdev-os/src/app/shell-showcase/**'
              - 'apps/loopdev-os/src/components/layout/suiteNavMode.ts'
              - 'ds/packages/ui/src/components/atoms/navigation/NavSidebarItem/**'
              - 'ds/packages/ui/src/components/atoms/surfaces/TechnicalDropdown/**'
              - 'ds/packages/ui/src/components/atoms/surfaces/TechnicalSurface/**'
              - 'ds/packages/ui/src/components/atoms/surfaces/TechnicalTooltip/**'
              - 'ds/packages/ui/src/components/composites/shell/**'
              - 'ds/packages/ui/src/components/composites/utilities/GlobalContextPanel/**'
              - 'ds/packages/ui/src/styles/globals.css'
              - 'packages/contracts/src/platform/navigation.ts'
              - 'scripts/check-shell.mjs'
              - 'vitest.config.ts'
              - 'package.json'

      - name: Resolve package impact
        id: impact
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/validate-package-impact.mjs --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Validate package impact resolver
        run: pnpm test:package-impact

      - name: Publish validation plan summary
        id: plan
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: pnpm validate:plan

      - name: Validate visual contract intent
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: pnpm design:visual:changed

  dependency-preflight:
    name: Dependency lockfile preflight
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Validate frozen dependency graph
        run: pnpm install --frozen-lockfile

  package-validation:
    name: Shared package contracts and consumers
    needs: [changes, dependency-preflight]
    if: needs.changes.outputs.package_validation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate affected packages and consumers
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: pnpm validate:package-impact --base "$BASE_SHA" --head "$HEAD_SHA"

  mobile-validation:
    name: Mobile contracts and behavior
    needs: [changes, dependency-preflight]
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate mobile lint
        run: pnpm --filter loopdev-mobile lint

      - name: Validate mobile typecheck
        run: pnpm --filter loopdev-mobile typecheck

      - name: Validate mobile tests
        run: pnpm --filter loopdev-mobile test

  shell-validation:
    name: Shell navigation, accessibility and geometry
    needs: [changes, dependency-preflight]
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @loopdev/contracts build

      - name: Validate shell interaction surface
        run: pnpm test:shell

  quality:
    name: Lint, typecheck, tests and build
    needs: [changes, dependency-preflight]
    if: github.event_name != 'pull_request' || needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TURBOPACK_EXPERIMENTAL_USE_SYSTEM_TLS_CERTS: '1'
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: CI validation
        run: pnpm validate:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: ignore

  frontend-e2e:
    name: Web flows, accessibility and visual behavior
    needs: [changes, dependency-preflight]
    if: >-
      needs.changes.outputs.frontend == 'true' &&
      (needs.changes.outputs.browser_desktop == 'true' ||
      needs.changes.outputs.browser_mobile == 'true' ||
      needs.changes.outputs.browser_visual == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_E2E_AUTH_BYPASS: 'true'
      PLAYWRIGHT_E2E_AUTH_BYPASS: 'true'
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @loopdev/contracts build

      - name: Build shared UI
        run: pnpm --filter @loopdev/ui build

      - name: Build application
        run: pnpm --filter loopdev-os build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run desktop checks
        if: needs.changes.outputs.browser_desktop == 'true'
        run: pnpm exec playwright test --project=desktop --workers=1 --reporter=line

      - name: Run authenticated Mobile Web checks
        if: needs.changes.outputs.browser_mobile == 'true'
        run: pnpm exec playwright test e2e/authenticated.mobile.spec.mjs --project=mobile --workers=1 --reporter=line

      - name: Run authenticated Mobile Compact checks
        if: needs.changes.outputs.browser_mobile == 'true'
        run: pnpm exec playwright test e2e/authenticated.mobile.spec.mjs --project=mobile-compact --workers=1 --reporter=line

      - name: Run Mobile Web visual checks
        if: needs.changes.outputs.browser_visual == 'true'
        run: pnpm exec playwright test e2e/responsive.visual.spec.mjs --project=mobile --workers=1 --reporter=line

      - name: Run Mobile Compact visual checks
        if: needs.changes.outputs.browser_visual == 'true'
        run: pnpm exec playwright test e2e/responsive.visual.spec.mjs --project=mobile-compact --workers=1 --reporter=line
