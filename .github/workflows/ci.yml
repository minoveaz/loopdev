name: Domain-aware validation CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  git-conventions:
    name: Delivery traceability and PR conventions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate branch, PR title and commits
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          COMMIT_RANGE: ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
        run: pnpm exec node scripts/validate-git-conventions.mjs --branch "$HEAD_BRANCH" --pr-title "$PR_TITLE" --range "$COMMIT_RANGE"

  changes:
    name: 'Validation plan: affected risks and surfaces'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      shell: ${{ steps.filter.outputs.shell }}
      quality: ${{ steps.plan.outputs.full_fallback }}
      package_validation: ${{ steps.impact.outputs.has_targeted_validation }}
      domain_ids: ${{ steps.impact.outputs.domain_ids }}
      cimo: ${{ contains(format(',{0},', steps.impact.outputs.domain_ids), ',cimo,') }}
      frontend: ${{ steps.impact.outputs.frontend == 'true' || steps.filter.outputs.frontend == 'true' }}
      backend: ${{ steps.filter.outputs.backend == 'true' }}
      mobile: ${{ steps.impact.outputs.mobile }}
      browser_desktop: ${{ steps.plan.outputs.browser_desktop }}
      browser_mobile: ${{ steps.plan.outputs.browser_mobile }}
      browser_visual: ${{ steps.plan.outputs.browser_visual }}
      e2e_desktop_functional: ${{ steps.plan.outputs.e2e_desktop_functional }}
      e2e_mobile_functional: ${{ steps.plan.outputs.e2e_mobile_functional }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Detect frontend changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              # Domain-owned application routing comes from catalog/package impact.
              # Keep this filter for shared frontend surfaces and browser specifications.
              # Keep this filter positive: `some` treats a negated glob as a match for unrelated paths.
              - 'apps/loopdev-os/src/components/**'
              - 'apps/loopdev-os/src/suites/**'
              - 'apps/loopdev-os/src/app/*.{ts,tsx}'
              - 'apps/loopdev-os/src/app/!(api)/**'
              - 'ds/packages/ui/**'
              - 'e2e/**'
              - 'playwright.config.mjs'
              - 'package.json'
              - 'pnpm-lock.yaml'
            backend:
              - 'apps/loopdev-os/src/app/api/**'
              - 'apps/loopdev-os/src/services/**'
              - 'apps/loopdev-os/src/types/**'
              - 'packages/contracts/**'
              - 'supabase/**'
              - 'scripts/crm-backend-*.mjs'
              - '.github/workflows/**'
            shell:
              - 'apps/loopdev-os/src/app/globals.css'
              - 'apps/loopdev-os/src/app/layout.tsx'
              - 'apps/loopdev-os/src/app/shell-showcase/**'
              - 'e2e/shell-showcase.contract.spec.mjs'
              - 'e2e/shell.visual.spec.mjs'
              - 'e2e/shell.visual.spec.mjs-snapshots/**'
              - 'apps/loopdev-os/src/components/layout/suiteNavMode.ts'
              - 'ds/packages/ui/src/components/atoms/navigation/NavSidebarItem/**'
              - 'ds/packages/ui/src/components/atoms/surfaces/TechnicalDropdown/**'
              - 'ds/packages/ui/src/components/atoms/surfaces/TechnicalSurface/**'
              - 'ds/packages/ui/src/components/atoms/surfaces/TechnicalTooltip/**'
              - 'ds/packages/ui/src/components/composites/shell/**'
              - 'ds/packages/ui/src/components/composites/utilities/GlobalContextPanel/**'
              - 'ds/packages/ui/src/styles/globals.css'
              - 'packages/contracts/src/platform/navigation.ts'
              - 'scripts/check-shell.mjs'
              - 'vitest.config.ts'
              - 'package.json'

      - name: Resolve package impact
        id: impact
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/validate-package-impact.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --dry-run

      - name: Validate domain testing catalog
        run: pnpm test:domain-catalog && pnpm validate:domain-catalog

      - name: Validate E2E testing catalog
        run: pnpm test:e2e-catalog && pnpm validate:e2e-catalog

      - name: Validate CI orchestration
        run: pnpm test:ci-orchestration && pnpm validate:ci-orchestration

      - name: Protect platform-owned shell surfaces
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: pnpm test:protected-surfaces && pnpm validate:protected-surfaces --base "$BASE_SHA" --head "$HEAD_SHA" --branch "$HEAD_BRANCH"

      - name: Validate package impact resolver
        run: pnpm test:package-impact

      - name: Publish validation plan summary
        id: plan
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: pnpm validate:plan

      - name: Validate visual contract intent
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: pnpm design:visual:changed

  track-integrity-alert:
    name: Informational track integrity alert
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Review validation-related changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: pnpm validate:track-integrity "$BASE_SHA" "$HEAD_SHA"

  dependency-preflight:
    name: Dependency lockfile preflight
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Validate frozen dependency graph
        run: pnpm install --frozen-lockfile

  package-validation:
    name: Shared package contracts and consumers
    needs: [changes, dependency-preflight]
    if: needs.changes.outputs.package_validation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'http://127.0.0.1:54321' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy-anon-key-for-build-prerender' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Cache Turbo artifacts
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @loopdev/contracts build

      - name: Validate affected packages and consumers
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: pnpm validate:package-impact --base "$BASE_SHA" --head "$HEAD_SHA"

  mobile-validation:
    name: Mobile contracts and behavior
    needs: [changes, dependency-preflight]
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Cache Turbo artifacts
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @loopdev/contracts build

      - name: Validate mobile lint
        run: pnpm --filter loopdev-mobile lint

      - name: Validate mobile typecheck
        run: pnpm --filter loopdev-mobile typecheck

      - name: Validate mobile tests
        run: pnpm --filter loopdev-mobile test

  shell-validation:
    name: Shell navigation, accessibility and geometry
    needs: [changes, dependency-preflight]
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Cache Turbo artifacts
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @loopdev/contracts build

      - name: Validate shell interaction surface
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: pnpm test:shell:changed

  quality:
    name: Lint, typecheck, tests and build
    needs: [changes, dependency-preflight]
    if: github.event_name != 'pull_request' || needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TURBOPACK_EXPERIMENTAL_USE_SYSTEM_TLS_CERTS: '1'
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'http://127.0.0.1:54321' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy-anon-key-for-build-prerender' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Cache Turbo artifacts
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: CI validation
        run: pnpm validate:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: ignore

  backend-validation:
    name: Backend contract and API tests
    needs: [changes, dependency-preflight]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Cache Turbo artifacts
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build contracts
        run: pnpm --filter @loopdev/contracts build
      - name: Run CRM API contract tests
        run: pnpm vitest run apps/loopdev-os/src/app/api/crm
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0
      - name: Start and reset local Supabase
        run: |
          supabase start
          supabase db reset
          eval "$(supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_DB_URL=$DB_URL" >> "$GITHUB_ENV"
      - name: Bootstrap authenticated CRM fixture
        run: pnpm test:crm:bootstrap
      - name: Start Next API
        run: |
          PORT=3001 pnpm --filter loopdev-os dev > /tmp/loopdev-os.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:3001/login >/dev/null && break
            sleep 1
          done
      - name: Run authenticated CRM HTTP checks
        env:
          CRM_BACKEND_BASE_URL: http://127.0.0.1:3001
        run: pnpm test:crm:backend-http
      - name: Stop local Supabase
        if: always()
        run: supabase stop

  frontend-validation:
    name: Frontend lint, tests and build
    needs: [changes, dependency-preflight]
    if: github.event_name == 'pull_request' && needs.changes.outputs.frontend == 'true' && needs.changes.outputs.quality != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'http://127.0.0.1:54321' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy-anon-key-for-build-prerender' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Cache Turbo artifacts
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate frontend surface
        run: pnpm validate:frontend-ci

  frontend-e2e-functional:
    name: Frontend E2E functional and accessibility
    needs: [changes, dependency-preflight]
    if: >-
      needs.changes.outputs.frontend == 'true' &&
      needs.changes.outputs.browser_desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_E2E_AUTH_BYPASS: 'true'
      PLAYWRIGHT_E2E_AUTH_BYPASS: 'true'
      NEXT_PUBLIC_CRM_CONTACTS_FIXTURE: 'true'
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup frontend E2E environment
        uses: ./.github/actions/setup-frontend-e2e

      - name: Run catalog-backed desktop E2E checks
        if: needs.changes.outputs.browser_desktop == 'true' && needs.changes.outputs.e2e_desktop_functional != ''
        run: >-
          pnpm e2e:profile
          files:${{ needs.changes.outputs.e2e_desktop_functional }}
          --project=desktop --workers=1 --reporter=line

      - name: Run catalog-backed desktop E2E checks
        if: >-
          needs.changes.outputs.browser_desktop == 'true' &&
          needs.changes.outputs.e2e_desktop_functional == ''
        run: >-
          pnpm e2e:profile
          profiles:smoke,accessibility,functional,domain,component,contract
          --project=desktop --workers=1 --reporter=line

      - name: Upload desktop E2E and Axe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-desktop-functional-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  frontend-e2e-visual:
    name: Frontend E2E visual behavior
    needs: [changes, dependency-preflight]
    if: >-
      needs.changes.outputs.frontend == 'true' &&
      needs.changes.outputs.browser_visual == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: shell
            runner: ubuntu-latest
          - suite: tables
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_E2E_AUTH_BYPASS: 'true'
      PLAYWRIGHT_E2E_AUTH_BYPASS: 'true'
      NEXT_PUBLIC_CRM_CONTACTS_FIXTURE: 'true'
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup frontend E2E environment
        uses: ./.github/actions/setup-frontend-e2e

      - name: Run shell and composition visual checks
        if: matrix.suite == 'shell'
        run: >-
          pnpm e2e:profile visual
          --project=desktop --workers=1 --reporter=line

      - name: Run table visual checks
        if: matrix.suite == 'tables'
        run: >-
          pnpm e2e:profile visual
          --project=desktop --workers=1 --reporter=line

      - name: Upload visual E2E and Axe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-visual-${{ matrix.suite }}-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  frontend-e2e-mobile:
    name: Frontend E2E mobile behavior
    needs: [changes, dependency-preflight]
    if: >-
      needs.changes.outputs.frontend == 'true' &&
      (needs.changes.outputs.browser_mobile == 'true' ||
      needs.changes.outputs.browser_visual == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_E2E_AUTH_BYPASS: 'true'
      PLAYWRIGHT_E2E_AUTH_BYPASS: 'true'
      NEXT_PUBLIC_CRM_CONTACTS_FIXTURE: 'true'
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup frontend E2E environment
        uses: ./.github/actions/setup-frontend-e2e

      - name: Run catalog-backed mobile E2E checks
        if: needs.changes.outputs.browser_mobile == 'true' && needs.changes.outputs.e2e_mobile_functional != ''
        run: >-
          pnpm e2e:profile
          files:${{ needs.changes.outputs.e2e_mobile_functional }}
          --project=mobile --project=mobile-compact --workers=1 --reporter=line

      - name: Run catalog-backed mobile E2E checks
        if: >-
          needs.changes.outputs.browser_mobile == 'true' &&
          needs.changes.outputs.e2e_mobile_functional == ''
        run: >-
          pnpm e2e:profile
          profiles:responsive,domain,component,diagnostic
          --project=mobile --project=mobile-compact --workers=1 --reporter=line

      - name: Run mobile visual checks
        if: needs.changes.outputs.browser_visual == 'true'
        run: >-
          pnpm e2e:profile visual
          --project=mobile --project=mobile-compact --workers=1 --reporter=line

      - name: Upload mobile E2E and Axe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-mobile-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
