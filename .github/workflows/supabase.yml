name: Supabase database validation

on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase.yml'
      - 'scripts/**supabase**'
      - 'scripts/validate-supabase-governance*'
  push:
    branches: [develop, main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase.yml'
      - 'scripts/**supabase**'
      - 'scripts/validate-supabase-governance*'
  schedule:
    - cron: '41 3 * * 2'

concurrency:
  group: supabase-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci-validation:
    name: Migrations and CI RLS baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Validate migration governance
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: pnpm validate:supabase-governance --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Test migration governance validator
        run: pnpm test:supabase-governance

      - name: Start local Supabase
        run: supabase start

      - name: Reset database from migrations and seed
        run: supabase db reset

      - name: Lint database schema
        run: supabase db lint --local

      - name: Validate database test catalog
        run: pnpm validate:data-catalog && pnpm test:data-catalog

      - name: Run database contract tests
        run: pnpm test:data
      - name: Prepare authenticated CRM integration fixture
        run: |
          eval "$(supabase status -o env)"
          supabase status -o env >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_DB_URL=$DB_URL" >> "$GITHUB_ENV"
      - name: Verify CRM backend bootstrap
        run: pnpm test:crm:bootstrap

      - name: Stop local Supabase
        if: always()
        run: supabase stop
